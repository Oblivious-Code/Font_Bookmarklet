<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Font Bookmarklet Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 540px; margin: 40px auto; padding: 20px; background: #f5f5f7; color: #1d1d1f; }
    .card { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    h1 { font-size: 22px; margin-top: 0; }
    p { font-size: 15px; color: #515154; line-height: 1.5; }
    .btn { display: inline-block; background: #0071e3; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 15px; border: none; cursor: pointer; width: 100%; text-align: center; }
    .btn-secondary { background: #e8e8ed; color: #1d1d1f; margin-bottom: 16px; }
    input[type="url"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d2d2d7; border-radius: 10px; margin: 10px 0 14px; }
    .output-box { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e5e5ea; }
    textarea { width: 100%; height: 120px; padding: 10px; font-family: monospace; font-size: 12px; border-radius: 10px; border: 1px solid #d2d2d7; background: #f9f9fb; margin-bottom: 10px; }
    .preview { padding: 18px; border-radius: 10px; background: #f5f5f7; margin-bottom: 8px; font-size: 26px; text-align: center; }
    .status { font-size: 13px; text-align: center; margin-bottom: 14px; color: #0071e3; font-weight: 600; word-break: break-all; }
    .slider-group { background: #f9f9fb; padding: 12px 14px; border-radius: 10px; border: 1px solid #e5e5ea; margin-bottom: 14px; }
    .slider-row { margin-bottom: 10px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input[type="range"] { width: 100%; accent-color: #0071e3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Google Font Bookmarklet Maker</h1>
    <p>1. Find a font on Google Fonts, copy its link, and paste it below to customize weight, bounce, and build your bookmarklet.</p>
    <a href="https://google.com" target="_blank" class="btn btn-secondary">Open Google Fonts ↗</a>
    <label for="fontUrl"><strong>Paste Google Fonts Link:</strong></label>
    <input type="url" id="fontUrl" placeholder="https://google.com/specimen/Shantell+Sans">
    <button class="btn" onclick="generateBookmarklet()">Generate Bookmarklet</button>

    <div class="output-box" id="outputBox">
      <div class="preview" id="fontPreview">Live Font Preview: The quick brown fox</div>
      <div class="status" id="fontStatus">Loading font...</div>

      <div class="slider-group">
        <div class="slider-row">
          <div class="slider-label">
            <span>Weight (Thickness)</span>
            <span id="weightVal">400</span>
          </div>
          <input type="range" id="weightSlider" min="300" max="800" step="50" value="400" oninput="updateStyles()">
        </div>
        <div class="slider-row">
          <div class="slider-label">
            <span>Bounce (Playful Wobble — variable fonts)</span>
            <span id="bounceVal">0</span>
          </div>
          <input type="range" id="bounceSlider" min="0" max="100" step="10" value="0" oninput="updateStyles()">
        </div>
      </div>

      <label><strong>Your Custom Bookmarklet Code:</strong></label>
      <textarea id="codeOutput" readonly></textarea>
      <button class="btn" id="copyBtn" onclick="copyCode()">Copy Bookmarklet Code</button>
    </div>
  </div>

  <script>
    let currentSlug = "";
    let currentFontName = "";
    let activeCssUrl = "";

    function generateBookmarklet() {
      const rawUrl = document.getElementById("fontUrl").value.trim();
      if (!rawUrl.includes("specimen/")) {
        alert("Paste a valid Google Fonts link (e.g., https://google.com/specimen/Shantell+Sans)");
        return;
      }

      currentSlug = rawUrl.split("specimen/").pop().split("?").shift().split("#").shift().replace(/\//g, "");
      currentFontName = decodeURIComponent(currentSlug.replace(/\+/g, " "));
      const host = "fon" + "ts.google" + "apis.com";

      const varUrl = "https://" + host + "/css2?family=" + currentSlug + ":BNCE,wght@0..100,300..800&display=swap";
      const stdUrl = "https://" + host + "/css2?family=" + currentSlug + ":wght@300..800&display=swap";
      const basicUrl = "https://" + host + "/css2?family=" + currentSlug + "&display=swap";

      // Show box immediately on tap
      document.getElementById("outputBox").style.display = "block";
      const statusEl = document.getElementById("fontStatus");
      statusEl.textContent = "Loading " + currentFontName + "...";
      statusEl.style.color = "#0071e3";

      activeCssUrl = basicUrl;
      updateStyles();

      fetch(varUrl)
        .then(function(res) {
          if (res.ok) return varUrl;
          return fetch(stdUrl).then(function(r2) { return r2.ok ? stdUrl : basicUrl; });
        })
        .then(function(validUrl) {
          activeCssUrl = validUrl;
          const oldLink = document.getElementById("dynamicFontLink");
          if (oldLink) oldLink.remove();

          const linkEl = document.createElement("link");
          linkEl.id = "dynamicFontLink";
          linkEl.rel = "stylesheet";
          linkEl.href = activeCssUrl;
          document.head.appendChild(linkEl);

          const hasBounce = activeCssUrl.includes("BNCE");
          statusEl.textContent = "Loaded: " + currentFontName + (hasBounce ? " (Bounce & Weight enabled!)" : " (Standard font)");
          statusEl.style.color = "#28a745";
          updateStyles();
        })
        .catch(function() {
          statusEl.textContent = "Loaded fallback URL for " + currentFontName;
          statusEl.style.color = "#d93025";
        });
    }

    function updateStyles() {
      if (!currentFontName) return;
      const weight = document.getElementById("weightSlider").value;
      const bounce = document.getElementById("bounceSlider").value;

      document.getElementById("weightVal").textContent = weight;
      document.getElementById("bounceVal").textContent = bounce;

      const previewEl = document.getElementById("fontPreview");
      previewEl.style.fontFamily = '"' + currentFontName + '", sans-serif';
      previewEl.style.fontWeight = weight;
      previewEl.style.fontVariationSettings = '"BNCE" ' + bounce;

      const cssRule = '*:not([class*="icon"]):not([class*="fa-"]):not(.material-icons){font-family:"' + currentFontName + '",sans-serif!important;font-weight:' + weight + '!important;font-variation-settings:"BNCE" ' + bounce + '!important;}';
      const bookmarklet = 'javascript:(function(){var l=document.createElement("link");l.rel="stylesheet";l.href="' + activeCssUrl + '";document.head.appendChild(l);var s=document.createElement("style");s.textContent=' + JSON.stringify(cssRule) + ';document.head.appendChild(s);})();';

      document.getElementById("codeOutput").value = bookmarklet;
    }

    function copyCode() {
      const copyText = document.getElementById("codeOutput");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      try { navigator.clipboard.writeText(copyText.value); } catch (e) { document.execCommand("copy"); }
      const btn = document.getElementById("copyBtn");
      btn.textContent = "Copied!";
      setTimeout(function() { btn.textContent = "Copy Bookmarklet Code"; }, 2000);
    }
  </script>
</body>
</html>
